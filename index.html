<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz-Game</title>
    <link rel="stylesheet" href="style.css">
    <link size="32x32" rel="icon" href="./assets/logo.png">
</head>
<body>
    <div class="container">
        <div class="screen active" id="start-screen">
            <h1>Quiz Game!</h1>
            <p>Test your general knowledge with this fun questions.</p>
            <button id="start-btn">Start</button>
        </div>

        <div class="screen" id="quiz-screen">
            <div class="quiz-header">
                <h2 id="question-text">Question Goes Here</h2>
            </div>
            <div class="quiz-info">
                    <p>Question <span id="current-question">1</span> of <span id="total-questions">5</span></p>
                    <p>Score : <span id="score">0</span></p>
            </div>

            <div class="answers-container" id="answers-container">

            </div>

            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <h2>Quiz Result!</h2>
            <div class="result-info">
                <p>You scored <span id="final-score">O</span> out of <span id="max-score">5</span></p>
                <p id="result-message">Good Job!</p>
            </div>
            <button id="restart-btn">Restart Quiz</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
